apply plugin: 'com.android.application'

android {
    namespace 'io.ticofab.androidgpxparser'
    compileSdk 37
    buildToolsVersion '33.0.0'

    defaultConfig {
        applicationId "io.ticofab.androidgpxparser"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 4
        versionName "2.4.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.9.1'
    implementation 'androidx.core:core-ktx:1.13.1'

    // Fix duplicate class errors with Kotlin stdlib
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22")
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22")
    }

    // line used for local development
    implementation project(':parser')

    // this should be used in your app
    // implementation 'com.github.ticofab:android-gpx-parser:2.0.1'
}
